services:
  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    container_name: jellyfin-on-the-go
    restart: unless-stopped
    ports:
      - "8096:8096/tcp"
    volumes:
      - ./config:/config:Z
      - ./cache:/cache:Z
      - ./media:/media:ro,Z
    # Optional Intel/AMD GPU access on Linux. Uncomment on a host with /dev/dri:
    # devices:
    #   - /dev/dri:/dev/dri
